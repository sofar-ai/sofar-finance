<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Truth — SOFAR FINANCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* PIPELINE_TRUTH_BOARD_V1 — the honest-measurement era board */
    .pt-wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
    .pt-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .pt-tile { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .pt-tile .v { font-size: 22px; font-family: 'IBM Plex Mono', monospace; }
    .pt-tile .k { font-size: 11px; color: var(--text-secondary); }
    .pt-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .pt-card h3 { margin: 0 0 10px; font-size: 14px; }
    table.pt-tbl { width: 100%; border-collapse: collapse; font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
    .pt-tbl th, .pt-tbl td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .pt-tbl th:first-child, .pt-tbl td:first-child { text-align: left; }
    .pt-tbl-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; }
    .pt-badge { padding: 1px 6px; border-radius: 8px; font-size: 10px; }
    .pt-active { background: rgba(34,197,94,.15); color: var(--green, #22c55e); }
    .pt-stale { background: rgba(239,68,68,.15); color: var(--red, #ef4444); }
    .pt-note { font-size: 11px; color: var(--text-secondary); font-family: 'IBM Plex Mono', monospace; margin: 6px 0; }
    .pt-empty { padding: 40px; text-align: center; color: var(--text-secondary); font-size: 13px; }
    .pt-svg { width: 100%; height: 150px; }
  </style>
</head>
<body class="page-scrollable">
  <div id="nav-root"></div>
  <script src="js/nav.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{NavComponent.setMeta(`<span class="live-dot"></span><span id="pt-status">Loading…</span>`);});</script>

  <div class="pt-wrap" id="pt-main"><div class="pt-empty">Loading pipeline truth…</div></div>

  <!-- UNIVERSE_PANEL_V1 (SOF-56): tier chips + probation badges + coverage.
       Feed: data/pipeline-truth.json .universe (publisher extension). -->
  <div class="pt-wrap" id="uni-wrap">
    <div style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:14px;">
      <h3 style="margin:0 0 10px;font-size:14px;">Universe <span id="uni-meta" style="color:var(--text-secondary);font-weight:400;font-size:11px;"></span></h3>
      <div id="uni-panel" style="font-size:12px;color:var(--text-secondary);">Loading universe…</div>
    </div>
  </div>
  <script>
  'use strict';
  (async function () {
    var host = document.getElementById('uni-panel');
    var d = null;
    try {
      var r = await fetch('data/pipeline-truth.json?t=' + Date.now());
      if (r.ok) d = await r.json();
    } catch (e) { /* degrade */ }
    var u = d && d.universe;
    if (!u) { host.textContent = 'No universe block yet — publisher extension has not run. Degrades by design.'; return; }
    if (u._error) { host.textContent = 'Universe block error (publisher fail-soft): ' + u._error; return; }
    document.getElementById('uni-meta').textContent = 'config v' + u.config_version + ' · updated ' + u.updated;
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
    var chip = function (m) {
      var badge = m.probation ? ' <span style="background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b55;border-radius:3px;padding:0 3px;font-size:9px;">PROBATION</span>' : '';
      var title = m.added_date ? ('added ' + m.added_date + ' — ' + (m.added_reason || '')) : 'pre-config era';
      return '<span title="' + esc(title) + '" style="display:inline-block;background:var(--bg-primary,#161b22);border:1px solid var(--border,#30363d);border-radius:4px;padding:1px 6px;margin:2px;font-family:monospace;font-size:11px;">' + esc(m.ticker) + badge + '</span>';
    };
    var html = '';
    var tierNames = { signal: 'Signal', options_greeks: 'Options + Greeks', iv_surface: 'IV Surface', ml_cohort_derived: 'ML Cohort (derived)' };
    Object.keys(tierNames).forEach(function (t) {
      var members = (u.tiers && u.tiers[t]) || [];
      html += '<div style="margin:6px 0;"><span style="display:inline-block;min-width:150px;color:var(--text-secondary);">' + tierNames[t] + ' (' + members.length + ')</span>' + members.map(chip).join('') + '</div>';
    });
    if ((u.watch || []).length) {
      html += '<div style="margin:6px 0;"><span style="display:inline-block;min-width:150px;color:var(--text-secondary);">Watch</span>' + u.watch.map(function (t) { return chip({ ticker: t + ' 👀', added_reason: 'WATCH — SOF-45 trigger armed' }); }).join('') + '</div>';
    }
    var cov = u.coverage || {};
    var ogr = ((u.tiers && u.tiers.options_greeks) || []).map(function (m) { return m.ticker; });
    html += '<div style="overflow-x:auto;margin-top:10px;"><table style="border-collapse:collapse;font-family:monospace;font-size:11px;width:100%;">' +
      '<tr style="color:var(--text-secondary);"><th style="text-align:left;padding:3px 6px;">options name</th><th style="text-align:right;">contracts</th><th style="text-align:right;">days</th><th style="text-align:left;padding-left:10px;">range</th><th style="text-align:right;">cov≈</th><th style="text-align:left;padding-left:10px;">flags</th></tr>' +
      ogr.map(function (t) {
        var c = cov[t];
        if (!c) return '<tr><td style="padding:3px 6px;">' + esc(t) + '</td><td colspan="4" style="text-align:right;color:var(--text-secondary);">no rows yet</td><td style="padding-left:10px;"><span style="color:#f59e0b;">EMPTY</span></td></tr>';
        var flags = (c.gap_flag ? '<span style="color:#ef4444;">GAP</span> ' : '') + (c.stale_flag ? '<span style="color:#f59e0b;">STALE</span>' : '');
        return '<tr><td style="padding:3px 6px;">' + esc(t) + '</td><td style="text-align:right;">' + Number(c.contracts).toLocaleString() + '</td><td style="text-align:right;">' + c.days + '</td><td style="padding-left:10px;">' + c.first + ' → ' + c.last + '</td><td style="text-align:right;">' + c.coverage_ratio_approx + '</td><td style="padding-left:10px;">' + (flags || '<span style="color:#22c55e;">ok</span>') + '</td></tr>';
      }).join('') + '</table></div>';
    var adds = (u.membership_history && u.membership_history.adds) || [];
    if (adds.length) {
      html += '<div style="margin-top:8px;color:var(--text-secondary);font-size:11px;">Recent adds: ' + adds.map(function (a) { return esc(a.ticker) + ' (' + esc(a.added_date) + ')'; }).join(' · ') + ' — ' + esc(u.membership_history.drops_note) + '</div>';
    }
    html += '<div style="margin-top:4px;color:var(--text-secondary);font-size:10px;">' + (u.notes || []).map(esc).join(' · ') + '</div>';
    host.innerHTML = html;
  })();
  </script>

  <script>
  'use strict';
  (async function () {
    var main = document.getElementById('pt-main');
    var status = function (t) { var el = document.getElementById('pt-status'); if (el) el.textContent = t; };
    var d = null;
    try {
      var r = await fetch('data/pipeline-truth.json?t=' + Date.now());
      if (r.ok) d = await r.json();
    } catch (e) {}
    if (!d || !d.signals) {
      main.innerHTML = '<div class="pt-empty">No pipeline-truth data yet — publisher (publish-pipeline-truth.py) has not run.</div>';
      status('no data'); return;
    }
    status('signals to ' + (d.latest_signal_date || '?'));
    var fmt = function (v, dp) { return (v === null || v === undefined) ? '—' : Number(v).toFixed(dp === undefined ? 2 : dp); };

    var grads = [];
    (d.signals || []).forEach(function (s) {
      (s.graduations || []).forEach(function (g) { grads.push([s.signal_name, g]); });
    });

    var html = '<div class="pt-tiles">' +
      '<div class="pt-tile"><div class="v">' + (d.n_signals || 0) + '</div><div class="k">v1.0 signals</div></div>' +
      '<div class="pt-tile"><div class="v">' + (d.n_active || 0) + '</div><div class="k">active (≤7d)</div></div>' +
      '<div class="pt-tile"><div class="v">' + ((d.n_signals || 0) - (d.n_active || 0)) + '</div><div class="k">stale</div></div>' +
      '<div class="pt-tile"><div class="v">' + grads.length + '</div><div class="k">graduations</div></div>' +
      '</div>';

    // Champion walk-forward Sharpe series — inline SVG, no vendor libs
    function sparkline(points) {
      var vals = points.map(function (p) { return p.walk_forward_sharpe; }).filter(function (v) { return v !== null && v !== undefined; });
      if (vals.length < 2) return '<div class="pt-note">insufficient archive points</div>';
      var w = 560, h = 130, pad = 26;
      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      if (mx === mn) { mx += 0.1; mn -= 0.1; }
      var xs = function (i) { return pad + (w - 2 * pad) * i / (points.length - 1); };
      var ys = function (v) { return h - pad - (h - 2 * pad) * (v - mn) / (mx - mn); };
      var path = '', circles = '';
      points.forEach(function (p, i) {
        var v = p.walk_forward_sharpe;
        if (v === null || v === undefined) return;
        path += (path ? ' L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1);
        circles += '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(v).toFixed(1) + '" r="2.5" fill="#58a6ff"><title>' +
          (p.trained_at || p.committed_at || '') + ' — wf Sharpe ' + fmt(v, 3) + ' (n=' + (p.walk_forward_scored || '?') + ', ' + (p.model_version || '') + ')</title></circle>';
      });
      return '<svg class="pt-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
        '<text x="4" y="' + (ys(mx) + 4) + '" font-size="9" fill="#8b949e">' + fmt(mx, 2) + '</text>' +
        '<text x="4" y="' + (ys(mn) + 4) + '" font-size="9" fill="#8b949e">' + fmt(mn, 2) + '</text>' +
        '<path d="' + path + '" stroke="#58a6ff" fill="none" stroke-width="1.5"/>' + circles + '</svg>';
    }
    html += '<div class="pt-card"><h3>Champion walk-forward Sharpe (weekly training archive)</h3>';
    ['7d', '14d', '21d'].forEach(function (hzn) {
      var pts = (d.champion_series || {})[hzn] || [];
      var last = pts.length ? pts[pts.length - 1] : {};
      html += '<div class="pt-note">' + hzn + ' — latest: wf Sharpe ' + fmt(last.walk_forward_sharpe, 3) +
        ', acc ' + fmt(last.walk_forward_accuracy, 3) + ' (n=' + (last.walk_forward_scored || '?') + ', ' +
        (last.model_version || '?') + ', trained ' + (last.trained_at ? String(last.trained_at).slice(0, 10) : '?') + ')</div>' +
        sparkline(pts);
    });
    html += '</div>';

    html += '<div class="pt-card"><h3>Graduations (honest metrics, verbatim from experiments)</h3><div class="pt-tbl-wrap"><table class="pt-tbl">' +
      '<tr><th>signal</th><th>graduated</th><th>to</th><th>backtest SR</th><th>CPCV SR</th><th>n</th><th>reaudit</th><th>honest ΔSR</th></tr>';
    grads.sort(function (a, b) { return (b[1].graduated_at || '').localeCompare(a[1].graduated_at || ''); });
    grads.forEach(function (gg) {
      var g = gg[1];
      html += '<tr><td>' + gg[0] + '</td><td>' + (g.graduated_at ? g.graduated_at.slice(0, 10) : '—') + '</td>' +
        '<td>' + (g.to_version || '—') + '</td><td>' + fmt(g.backtest_sharpe, 3) + '</td><td>' + fmt(g.cpcv_sharpe, 3) + '</td>' +
        '<td>' + (g.n_scored || '—') + '</td><td>' + (g.honest_reaudit_status || '—') + '</td><td>' + fmt(g.honest_sharpe_delta, 3) + '</td></tr>';
    });
    if (!grads.length) html += '<tr><td colspan="8" class="pt-note">none recorded</td></tr>';
    html += '</table></div></div>';

    html += '<div class="pt-card"><h3>v1.0 signal set (era annotations)</h3><div class="pt-tbl-wrap"><table class="pt-tbl">' +
      '<tr><th>signal</th><th>status</th><th>first</th><th>last</th><th>days</th><th>graduated?</th></tr>';
    (d.signals || []).forEach(function (s) {
      html += '<tr><td>' + s.signal_name + '</td>' +
        '<td><span class="pt-badge ' + (s.status === 'active' ? 'pt-active' : 'pt-stale') + '">' + s.status +
        (s.status !== 'active' && s.stale_days ? ' ' + s.stale_days + 'd' : '') + '</span></td>' +
        '<td>' + s.first_date + '</td><td>' + s.last_date + '</td><td>' + s.n_days + '</td>' +
        '<td>' + ((s.graduations || []).length ? '🎓 ' + s.graduations.length : '') + '</td></tr>';
    });
    html += '</table></div>';
    html += (d.method_notes || []).map(function (n) { return '<div class="pt-note">· ' + n + '</div>'; }).join('');
    html += '</div>';
    main.innerHTML = html;
  })();
  </script>
</body>
</html>
