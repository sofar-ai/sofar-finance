<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Health — SOFAR Finance</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#0d1117">
  <style>
    .health-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }
    .health-title { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-primary); margin-bottom: 6px; }
    .health-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }
    .health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    @media (max-width: 700px) { .health-grid { grid-template-columns: 1fr; } }
    .health-card { background: #0a0f16; border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
    .health-card-full { grid-column: 1 / -1; }
    .hc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .hc-title { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7280; }
    .hc-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 3px; text-transform: uppercase; }
    .hc-badge-ok { background: rgba(34,197,94,0.12); color: #22c55e; border: 1px solid rgba(34,197,94,0.25); }
    .hc-badge-warn { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }
    .hc-badge-err { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
    .hc-badge-stale { background: rgba(107,114,128,0.12); color: #6b7280; border: 1px solid rgba(107,114,128,0.25); }
    .hc-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 11px; }
    .hc-row:last-child { border-bottom: none; }
    .hc-label { color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px; }
    .hc-value { color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; text-align: right; }
    .hc-value-ok { color: #22c55e; }
    .hc-value-warn { color: #f59e0b; }
    .hc-value-err { color: #ef4444; }
    .hc-value-muted { color: #4b5563; }
    .hc-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .hc-dot-ok { background: #22c55e; box-shadow: 0 0 4px rgba(34,197,94,0.4); }
    .hc-dot-warn { background: #f59e0b; }
    .hc-dot-err { background: #ef4444; }
    .hc-dot-stale { background: #6b7280; }
    .health-refresh-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .health-refresh-btn { background: #0a0f16; border: 1px solid var(--border); border-radius: 4px; color: var(--text-secondary); font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; padding: 6px 14px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .health-refresh-btn:hover { border-color: #60a5fa; color: #60a5fa; }
    .health-ts { font-family: var(--font-mono); font-size: 10px; color: #4b5563; }
    .hc-bar-wrap { height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .hc-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
    .hc-bar-ok { background: #22c55e; }
    .hc-bar-warn { background: #f59e0b; }
    .hc-bar-err { background: #ef4444; }
    .health-overall { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #0a0f16; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
    .health-overall-score { font-family: var(--font-mono); font-size: 28px; font-weight: 700; line-height: 1; }
    .health-overall-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #6b7280; }
    .health-overall-detail { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  </style>
</head>
<body class="page-scrollable">
  <div id="nav-root"></div>
  <script src="js/nav.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{NavComponent.setMeta(`<span class="live-dot"></span>LIVE<span style="margin-left:8px" id="clock"></span>`);});</script>
  <div class="health-wrap">
    <div class="health-title">🏥 System Health</div>
    <div class="health-subtitle">Real-time diagnostics for all SOFAR data feeds, services, and pipelines</div>
    <div class="health-refresh-row">
      <button class="health-refresh-btn" onclick="HealthCheck.run()">↻ Run Health Check</button>
      <span class="health-ts" id="health-ts">Checking...</span>
    </div>
    <div id="health-overall"></div>
    <div class="health-grid" id="health-grid">
      <div class="health-card health-card-full" style="text-align:center;color:#4b5563;padding:40px">Running diagnostics...</div>
    </div>
  </div>
  <script src="js/health.js"></script>
  <script>
    function updateClock(){var el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' ET';}
    updateClock();setInterval(updateClock,1000);
    HealthCheck.run();
  </script>
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mbn-item"><span class="mbn-icon">📈</span><span class="mbn-label">Market</span></a>
    <a href="options-flow.html" class="mbn-item"><span class="mbn-icon">🌊</span><span class="mbn-label">Flow</span></a>
    <a href="ai-analysis.html" class="mbn-item"><span class="mbn-icon">🤖</span><span class="mbn-label">AI</span></a>
    <a href="daily-summary.html" class="mbn-item"><span class="mbn-icon">📋</span><span class="mbn-label">Summary</span></a>
    <a href="performance.html" class="mbn-item"><span class="mbn-icon">🎯</span><span class="mbn-label">Perf</span></a>
    <a href="config.html" class="mbn-item"><span class="mbn-icon">⚙️</span><span class="mbn-label">Config</span></a>
  </nav>
</body>
</html>
