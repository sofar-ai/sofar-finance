<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper P&L — SOFAR FINANCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* PREDICTION_TRACKING_PAPER_PNL_V1 — replaces the retired paper-trading simulator page */
    .pp-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .pp-note { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
               padding: 10px 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px;
               font-family: 'IBM Plex Mono', monospace; }
    .pp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
    .pp-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .pp-card h3 { margin: 0 0 10px; font-size: 14px; }
    .pp-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0;
              font-family: 'IBM Plex Mono', monospace; }
    .pp-row .k { color: var(--text-secondary); }
    .pp-pos { color: var(--green, #22c55e); } .pp-neg { color: var(--red, #ef4444); }
    .pp-muted { color: var(--text-secondary); }
    table.pp-tbl { width: 100%; border-collapse: collapse; font-size: 11px;
                   font-family: 'IBM Plex Mono', monospace; margin-top: 12px; }
    .pp-tbl th, .pp-tbl td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--border); }
    .pp-tbl th:first-child, .pp-tbl td:first-child { text-align: left; }
    .pp-tbl-wrap { overflow-x: auto; }
    .pp-empty { padding: 40px; text-align: center; color: var(--text-secondary); font-size: 13px; }
  </style>
</head>
<body class="page-scrollable">
  <div id="nav-root"></div>
  <script src="js/nav.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{NavComponent.setMeta(`<span class="live-dot"></span><span id="pp-status">Loading…</span>`);});</script>

  <div class="pp-wrap" id="pp-main">
    <div class="pp-empty">Loading paper P&L…</div>
  </div>

  <!-- ACCURACY_TREND_HONEST_N_V1 (SOF-48): per-horizon rolling live accuracy.
       Feed: data/accuracy-trend.json (publish-accuracy-trend.py, nightly).
       Grey segments = honest non-overlap n below floor: uninterpretable. -->
  <div class="pp-wrap" id="acc-trend-wrap">
    <div class="pp-card" style="margin-top:14px">
      <h3>Live directional accuracy — per horizon <span class="pp-muted">(traded only; grey = below honest-n floor)</span></h3>
      <div id="acc-trend" class="pp-empty">Loading accuracy trend…</div>
    </div>
  </div>
  <script>
  'use strict';
  (async function () {
    var host = document.getElementById('acc-trend');
    var d = null;
    try {
      var r = await fetch('data/accuracy-trend.json?t=' + Date.now());
      if (r.ok) d = await r.json();
    } catch (e) { /* degrade */ }
    if (!d || !d.series) {
      host.innerHTML = 'No accuracy-trend data yet — publisher (publish-accuracy-trend.py) has not run. Degrades by design.';
      return;
    }
    var W = 560, H = 190, PL = 34, PR = 8, PT = 10, PB = 22;
    var COLORS = { rolling_30d: '#60a5fa', rolling_60d: '#a78bfa', cumulative: '#22c55e' };
    var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
    function chart(src) {
      var ser = d.series[src]; if (!ser) return '';
      var all = ser.cumulative || [];
      if (!all.length) return '';
      var d0 = new Date(all[0][0]).getTime(), d1 = new Date(all[all.length - 1][0]).getTime();
      var x = function (ds) { return PL + (W - PL - PR) * (new Date(ds).getTime() - d0) / Math.max(1, d1 - d0); };
      var y = function (a) { return PT + (H - PT - PB) * (1 - a); };
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:' + W + 'px">';
      [0, 0.25, 0.5, 0.75, 1].forEach(function (g) {
        svg += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--border,#333)" stroke-width="' + (g === 0.5 ? 1 : 0.4) + '"' + (g === 0.5 ? ' stroke-dasharray="4 3"' : '') + '/>' +
               '<text x="2" y="' + (y(g) + 3) + '" font-size="8" fill="var(--text-secondary,#888)">' + (g * 100) + '%</text>';
      });
      ((d.annotations && d.annotations.major) || []).forEach(function (a) {
        var t = new Date(a.date).getTime(); if (t < d0 || t > d1) return;
        svg += '<line x1="' + x(a.date) + '" x2="' + x(a.date) + '" y1="' + PT + '" y2="' + (H - PB) + '" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 3"><title>' + esc(a.date + ' — ' + a.label) + '</title></line>';
      });
      for (var t = d0; t <= d1; t += 86400000) {
        if (new Date(t).getUTCDay() === 0) svg += '<line x1="' + x(new Date(t).toISOString().slice(0, 10)) + '" x2="' + x(new Date(t).toISOString().slice(0, 10)) + '" y1="' + (H - PB) + '" y2="' + (H - PB + 4) + '" stroke="var(--text-secondary,#888)" stroke-width="0.6"><title>Sunday retrain</title></line>';
      }
      Object.keys(COLORS).forEach(function (wk) {
        var pts = ser[wk] || [], seg = '', mode = null, out = '';
        pts.forEach(function (p) {
          if (p[1] === null) { if (seg) { out += seg; } seg = ''; mode = null; return; }
          var m = p[5] ? 'grey' : 'solid';
          if (m !== mode && seg) { out += seg; seg = ''; }
          if (!seg) seg = '<polyline fill="none" stroke="' + (m === 'grey' ? 'var(--text-secondary,#777)' : COLORS[wk]) + '" stroke-width="' + (m === 'grey' ? 0.8 : 1.6) + '"' + (m === 'grey' ? ' stroke-dasharray="2 2" opacity="0.55"' : '') + ' points="';
          mode = m; seg += x(p[0]) + ',' + y(p[1]) + ' ';
        });
        if (seg) out += seg;
        // close every polyline tag
        svg += out.split('points="').map(function (c, i) { return i === 0 ? c : c + '"/>'; }).join('points="');
      });
      var last = ser.cumulative[ser.cumulative.length - 1];
      return '<div style="margin-top:10px"><div class="pp-row"><span class="k">' + esc(src) + '</span><span>cumulative ' + (last[1] === null ? '—' : (100 * last[1]).toFixed(1) + '%') + ' <span class="pp-muted">(traded n=' + last[2] + ', honest n=' + last[3] + (last[5] ? ' — BELOW FLOOR ' + d.floor + ', uninterpretable' : '') + ')</span></span></div>' + svg + '</svg></div>';
    }
    var html = '<div class="pp-note">Feed: accuracy-trend.json · traded-only accuracy, point-in-time by resolution date · honest non-overlap floor = ' + esc(d.floor) + ' (grey below) · <span style="color:#60a5fa">30d</span> / <span style="color:#a78bfa">60d</span> / <span style="color:#22c55e">cumulative</span> · amber dashes: era boundary + graduate adoption · baseline ticks: Sunday retrains</div>';
    ['lgbm_7d', 'lgbm_14d', 'lgbm_21d'].forEach(function (s) { html += chart(s); });
    host.innerHTML = html;
  })();
  </script>

  <script>
  'use strict';
  // Degradation contract (SOF-33 design note): the predecessor CRASHED on its
  // own corrupt file for 18 days. This page must render SOMETHING on every
  // failure mode: missing file, bad JSON, missing fields, empty sources.
  (async function () {
    var main = document.getElementById('pp-main');
    var status = function (t) { var el = document.getElementById('pp-status'); if (el) el.textContent = t; };
    var d = null;
    try {
      var r = await fetch('data/paper-pnl.json?t=' + Date.now());
      if (r.ok) d = await r.json();
    } catch (e) { /* fall through to empty state */ }
    if (!d || typeof d !== 'object' || !d.sources) {
      main.innerHTML = '<div class="pp-empty">No paper-P&L data yet — publisher (publish-paper-pnl.py) has not run, or the feed is unreadable.<br>Nothing is broken on this page; it degrades by design.</div>';
      status('no data');
      return;
    }
    status('as of ' + (d.date || '?'));
    var fmt = function (v, dp, suf) { return (v === null || v === undefined) ? '—' : (Number(v).toFixed(dp === undefined ? 2 : dp) + (suf || '')); };
    var cls = function (v) { return v > 0 ? 'pp-pos' : v < 0 ? 'pp-neg' : ''; };
    var html = '<div class="pp-note">Method: ' +
      ((d.method && d.method.trade_rule) || '') + ' · ' +
      ((d.method && d.method.cum_note) || '') + ' · ' +
      ((d.method && d.method.sharpe_rule) || '') + '</div><div class="pp-grid">';
    var order = ['lgbm_7d', 'lgbm_14d', 'lgbm_21d'];
    order.forEach(function (src) {
      var s = d.sources[src];
      if (!s) return;
      var no = s.honest_nonoverlap || {};
      html += '<div class="pp-card"><h3>' + src + ' <span class="pp-muted">(' + (s.horizon_days || '?') + 'd horizon)</span></h3>' +
        '<div class="pp-row"><span class="k">predictions / resolved / pending</span><span>' + fmt(s.n_predictions, 0) + ' / ' + fmt(s.n_resolved, 0) + ' / ' + fmt(s.n_pending, 0) + '</span></div>' +
        '<div class="pp-row"><span class="k">traded (non-neutral)</span><span>' + fmt(s.n_traded, 0) + ' <span class="pp-muted">(+' + fmt(s.n_neutral_no_trade, 0) + ' neutral, no trade)</span></span></div>' +
        '<div class="pp-row"><span class="k">hit rate (traded)</span><span>' + (s.hit_rate_traded === null || s.hit_rate_traded === undefined ? '—' : (100 * s.hit_rate_traded).toFixed(1) + '%') + '</span></div>' +
        '<div class="pp-row"><span class="k">directional accuracy (all)</span><span>' + (s.directional_accuracy_all === null || s.directional_accuracy_all === undefined ? '—' : (100 * s.directional_accuracy_all).toFixed(1) + '%') + '</span></div>' +
        '<div class="pp-row"><span class="k">cum return (overlapping sum)</span><span class="' + cls(s.cum_return_sum_pct) + '">' + fmt(s.cum_return_sum_pct, 2, '%') + '</span></div>' +
        '<div class="pp-row"><span class="k">avg / trade</span><span class="' + cls(s.avg_trade_return_pct) + '">' + fmt(s.avg_trade_return_pct, 3, '%') + '</span></div>' +
        '<div class="pp-row"><span class="k">honest non-overlap n</span><span>' + fmt(no.n, 0) + '</span></div>' +
        '<div class="pp-row"><span class="k">non-overlap mean ± std</span><span>' + fmt(no.mean_pct, 3, '%') + ' ± ' + fmt(no.std_pct, 3, '%') + '</span></div>' +
        '<div class="pp-row"><span class="k">annualized Sharpe</span><span>' + (no.annualized_sharpe === null || no.annualized_sharpe === undefined ? '<span class="pp-muted">withheld</span>' : fmt(no.annualized_sharpe, 3)) + '</span></div>' +
        (no.sharpe_note ? '<div class="pp-row"><span class="k" style="font-size:10px">' + no.sharpe_note + '</span></div>' : '') +
        '</div>';
    });
    html += '</div>';

    // recent predictions table (all sources merged, newest first, cap 30)
    var rows = [];
    order.forEach(function (src) {
      var s = d.sources[src];
      ((s && s.predictions) || []).forEach(function (p) { rows.push([src, p]); });
    });
    rows.sort(function (a, b) { return (b[1].entry_date || '').localeCompare(a[1].entry_date || ''); });
    html += '<div class="pp-card" style="margin-top:14px"><h3>Recent predictions</h3><div class="pp-tbl-wrap"><table class="pp-tbl">' +
      '<tr><th>entry</th><th>source</th><th>dir</th><th>prob</th><th>resolved</th><th>correct</th><th>raw move %</th><th>trade ret %</th></tr>';
    rows.slice(0, 30).forEach(function (rp) {
      var src = rp[0], p = rp[1] || {};
      var tr = p.trade_return_pct;
      html += '<tr><td>' + (p.entry_date || '—') + '</td><td>' + src + '</td><td>' + (p.direction || '—') + '</td>' +
        '<td>' + fmt(p.probability, 3) + '</td><td>' + (p.resolved ? 'y' : 'pending') + '</td>' +
        '<td>' + (p.correct === true ? '✓' : p.correct === false ? '✗' : '—') + '</td>' +
        '<td>' + fmt(p.raw_pnl_pct, 3) + '</td>' +
        '<td class="' + cls(tr) + '">' + (p.direction === 'NEUTRAL' ? 'no trade' : fmt(tr, 3)) + '</td></tr>';
    });
    html += '</table></div></div>';
    main.innerHTML = html;
  })();
  </script>
</body>
</html>
